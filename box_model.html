<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model Example</title>
    <style>
        .box {
            width: 200px;            /* Content width */
            padding: 20px;           /* Space inside border */
            border: 5px solid blue;  /* Border thickness */
            margin: 30px;            /* Space outside border */
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model Demonstration</h1>
    <div class="box">
        This box demonstrates <br>
        Content, Padding, Border, and Margin.
    </div>

    <ul>
        <li><strong>Content:</strong> The actual text area inside the box.</li>
        <li><strong>Padding:</strong> Space between content and border.</li>
        <li><strong>Border:</strong> The edge around padding and content.</li>
        <li><strong>Margin:</strong> Space outside the border.</li>
    </ul>
</body>
</html>
