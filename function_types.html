<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Parameter and Return Types</title>
    <script>
        function addNumbers(a, b) {
            return a + b; // Return type: Number
        }

        function greet(name) {
            return `Hello, ${name}!`; // Return type: String
        }

        function showResults() {
            let sum = addNumbers(10, 20);
            let message = greet("Gani");
            
            document.getElementById("results").innerHTML = `
                Sum (Number): ${sum} <br>
                Greeting (String): ${message}
            `;
        }
    </script>
</head>
<body>
    <h1>Function Parameter and Return Types Example</h1>
    <button onclick="showResults()">Show Function Results</button>
    <div id="results"></div>
</body>
</html>
